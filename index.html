<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중세 권력 생존 게임 ― 하인리히 4세, 왕위를 지켜라!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 네오둥근모 웹폰트 적용 (8비트/16비트 레트로 픽셀 감성) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">
    <!-- html2canvas (인스타그램 카드 이미지 다운로드) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- canvas-confetti (축하 폭죽 효과) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'NeoDunggeunmo', sans-serif;
            background-color: #0b0c10;
            background-image: radial-gradient(#374151 2px, transparent 2px);
            background-size: 24px 24px;
            color: #f3f4f6;
            -webkit-font-smoothing: none;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.8);
        }
        .game-window {
            border: 4px solid #1f2937;
            background-color: #111318;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.95), 0 0 30px rgba(59, 130, 246, 0.2);
        }
        .panel-box {
            border: 2px solid #374151;
            background-color: #1a1c23;
        }
        .pixel-btn {
            border: 2px solid #4b5563;
            background-color: #1f2937;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.8);
        }
        .pixel-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000;
            background-color: #374151;
        }
        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
        }
        .progress-bar-transition {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="game-container" class="w-full max-w-2xl game-window rounded-sm overflow-hidden relative flex flex-col">
        
        <!-- 레트로 오락실 타이틀바 -->
        <div class="bg-slate-950 px-4 py-2 flex justify-between items-center border-b-2 border-slate-800 text-xs text-slate-400 select-none">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 bg-red-500 inline-block shadow-sm"></span>
                <span class="w-3 h-3 bg-yellow-500 inline-block shadow-sm"></span>
                <span class="w-3 h-3 bg-green-500 inline-block shadow-sm"></span>
                <span class="ml-2 text-slate-300 tracking-wider">HENRY_IV_SIM_1077.exe [RPG ARCADE]</span>
            </div>
            <div class="text-indigo-400 text-[11px]">[v3.0 FULL SCENARIO]</div>
        </div>

        <div class="p-6 space-y-6 flex-1 flex flex-col justify-between">
            
            <div class="space-y-6">
                <div id="status-bar" class="hidden flex justify-between items-center bg-slate-900 p-3 panel-box text-sm md:text-base shadow-inner">
                    <div class="flex items-center space-x-2">
                        <span class="text-yellow-400">👑 왕권:</span>
                        <span id="king-power" class="text-yellow-300">50</span>%
                        <div class="w-20 md:w-28 bg-slate-950 h-4 border-2 border-slate-700 ml-1">
                            <div id="power-bar" class="bg-yellow-400 h-full progress-bar-transition" style="width: 50%;"></div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-blue-400">✝️ 교황 관계:</span>
                        <span id="pope-relation" class="text-blue-300">50</span>%
                        <div class="w-20 md:w-28 bg-slate-950 h-4 border-2 border-slate-700 ml-1">
                            <div id="pope-bar" class="bg-blue-500 h-full progress-bar-transition" style="width: 50%;"></div>
                        </div>
                    </div>
                </div>

                <!-- 동적 컨텐츠 출력 영역 -->
                <div id="content-area" class="space-y-6">
                    <!-- JS로 동적 렌더링 -->
                </div>
            </div>

            <div id="back-btn-container" class="hidden pt-6 mt-4 border-t-2 border-slate-800 flex justify-start">
                <button onclick="prevStage()" class="pixel-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 text-xs md:text-sm text-slate-200 flex items-center space-x-2">
                    <span>◀ 이전 단계로 돌아가기</span>
                </button>
            </div>
        </div>
    </div>

    <div id="feedback-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 panel-box p-6 max-w-md w-full space-y-5 text-center shadow-2xl border-4 border-slate-700">
            <h3 id="modal-title" class="text-2xl text-yellow-300 mb-2"></h3>
            <p id="modal-desc" class="text-sm md:text-base leading-relaxed text-slate-200 break-keep"></p>
            <button id="modal-btn" onclick="closeModal()" class="pixel-btn bg-indigo-600 hover:bg-indigo-500 px-6 py-3 text-white text-lg w-full mt-4">
                확인
            </button>
        </div>
    </div>

    <script>
        // 📌 선생님의 게시판 주소(URL)를 여기에 설정하세요!
        const BOARD_URL = "https://quizn.show/pbd/info/board/0033043"; 

        let currentStage = 0; // 0: 표지, 1~5: 게임 스테이지, 6: 인스타그램 활동
        let historyStack = [];
        let kingPower = 50;
        let popeRelation = 50;

        function saveState() {
            historyStack.push({
                stage: currentStage,
                power: kingPower,
                pope: popeRelation
            });
        }

        function renderStage() {
            const container = document.getElementById('content-area');
            const statusBar = document.getElementById('status-bar');
            const backBtnContainer = document.getElementById('back-btn-container');

            if (currentStage === 0) {
                statusBar.classList.add('hidden');
                backBtnContainer.classList.add('hidden');
                renderTitleScreen(container);
            } else {
                statusBar.classList.remove('hidden');
                backBtnContainer.classList.remove('hidden');
                updateStatusBar();

                if (currentStage === 1) renderStage1();
                else if (currentStage === 2) renderStage2();
                else if (currentStage === 3) renderStage3();
                else if (currentStage === 4) renderStage4();
                else if (currentStage === 5) renderStage5();
                else if (currentStage === 6) renderStage6();
            }
        }

        function updateStatusBar() {
            document.getElementById('king-power').innerText = kingPower;
            document.getElementById('power-bar').style.width = kingPower + '%';
            document.getElementById('pope-relation').innerText = popeRelation;
            document.getElementById('pope-bar').style.width = popeRelation + '%';
        }

        function nextStage() {
            saveState();
            currentStage++;
            renderStage();
        }

        function prevStage() {
            if (historyStack.length > 0) {
                const prevState = historyStack.pop();
                currentStage = prevState.stage;
                kingPower = prevState.power;
                popeRelation = prevState.pope;
                renderStage();
            } else if (currentStage > 1) {
                currentStage--;
                renderStage();
            }
        }

        function goToBoard() {
            showModal(
                "📌 게시판 제출 안내",
                "게시물 등록 시 <strong>[게시물 제목]에 학번+이름</strong>을 반드시 입력해 주세요!<br><br><span class='text-yellow-300 font-bold'>예시: 10101 홍길동</span>",
                true,
                function() {
                    window.open(BOARD_URL, '_blank');
                }
            );
        }

        function showModal(title, desc, isCorrect, callback) {
            const modal = document.getElementById('feedback-modal');
            const titleEl = document.getElementById('modal-title');
            const btnEl = document.getElementById('modal-btn');
            
            titleEl.innerHTML = title;

            if (title.includes('게시판')) {
                titleEl.className = "text-2xl text-yellow-300 mb-2";
                if (btnEl) btnEl.innerText = "🚀 게시판으로 이동하기";
            } else if (isCorrect) {
                titleEl.className = "text-2xl text-green-400 mb-2";
                if (btnEl) btnEl.innerText = "확인 (다음 단계로)";
            } else if (title.includes('경고') || title.includes('위기')) {
                titleEl.className = "text-2xl text-red-400 mb-2 animate-pulse";
                if (btnEl) btnEl.innerText = "다시 선택하기";
            } else {
                titleEl.className = "text-2xl text-red-400 mb-2";
                if (btnEl) btnEl.innerText = "다시 선택하기";
            }

            document.getElementById('modal-desc').innerHTML = desc;
            window.modalCallback = callback;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('feedback-modal').classList.add('hidden');
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        function renderTitleScreen(container) {
            container.innerHTML = `
                <div class="text-center space-y-8 py-4">
                    <div class="text-red-500 text-sm md:text-base tracking-widest animate-pulse">[ HISTORICAL RPG SIMULATION ]</div>
                    <h1 class="text-3xl md:text-4xl text-yellow-400 leading-snug">
                        🎮 중세 권력 생존 게임<br>
                        <span class="text-white text-xl md:text-2xl mt-2 block">― 하인리히 4세, 왕위를 지켜라! ―</span>
                    </h1>
                    <div class="bg-slate-900 p-5 panel-box text-yellow-200 text-sm md:text-base leading-relaxed inline-block border-2 border-slate-600">
                        <span class="text-slate-400">▶ 핵심 탐구 질문</span><br>
                        <span class="text-white block mt-4 whitespace-pre-line text-base md:text-lg leading-relaxed">파문을 당한 하인리히 4세는
왜 한겨울에 알프스를 넘어
교황을 찾아 카노사를 향했을까?</span>
                    </div>
                    <div class="pt-4 flex justify-center">
                        <button onclick="nextStage()" class="pixel-btn bg-red-600 hover:bg-red-500 text-yellow-300 font-bold tracking-[0.25em] pl-[0.25em] py-3 text-lg md:text-xl text-center block w-48">
                            START
                        </button>
                    </div>
                </div>
            `;
        }

        function renderStage1() {
            document.getElementById('content-area').innerHTML = `
                <div class="space-y-5">
                    <div class="text-indigo-400 text-base">[ 🕹️ 1단계 ― 왕이라고 마음대로 할 수 있다고? ]</div>
                    
                    <div class="bg-slate-900 p-5 panel-box text-slate-200 text-sm md:text-base leading-relaxed break-keep border-l-4 border-l-indigo-500">
                        <span class="text-yellow-400 font-bold block mb-2">📜 상황</span>
                        “나는 신성 로마 제국의 왕 하인리히 4세다.<br>
                        하지만 왕이라고 해서 제국의 모든 지역을 마음대로 다스릴 수 있는 것은 아니다.<br>
                        제국 곳곳에는 강력한 제후들이 자신의 영지와 군사력을 가지고 있다.<br>
                        왕권을 안정시키려면 이들의 협력이 필요하다.”
                    </div>

                    <div class="space-y-3 pt-2">
                        <p class="text-yellow-300 text-sm md:text-base pb-1 font-bold">🎯 미션<br><span class="text-white font-normal">Q. 이런 상황에서 왕권을 유지하기 위해 특히 협력이 필요한 사람들은 누구일까?</span></p>
                        <button onclick="checkStage1(1)" class="pixel-btn bg-slate-900 hover:bg-slate-800 w-full p-4 text-left text-sm md:text-base text-slate-200">① 제후와 고위 성직자</button>
                        <button onclick="checkStage1(2)" class="pixel-btn bg-slate-900 hover:bg-slate-800 w-full p-4 text-left text-sm md:text-base text-slate-200">② 농노만 있으면 된다</button>
                        <button onclick="checkStage1(3)" class="pixel-btn bg-slate-900 hover:bg-slate-800 w-full p-4 text-left text-sm md:text-base text-slate-200">③ 왕 혼자 모든 지역을 직접 통치한다</button>
                    </div>
                </div>
            `;
        }

        function checkStage1(choice) {
            if (choice === 1) {
                showModal("✅ 역사 포인트", "맞았습니다! 신성 로마 제국의 왕은 강력한 제후들과 주교 등 여러 유력 세력의 협력이 필요했습니다. 왕이라고 해서 제국 전체를 마음대로 통제할 수 있었던 것은 아닙니다.", true, nextStage);
            } else if (choice === 2) {
                showModal("❌ 왜 틀렸을까?", "농민과 농노는 중세 사회에서 매우 중요한 생산자였지만, 왕권을 직접 지탱하는 핵심 정치 세력은 아니었습니다. 왕에게는 자신의 영지와 군사력을 가진 제후들의 협력이 특히 중요했습니다.", false, null);
            } else {
                showModal("❌ 왜 틀렸을까?", "중세의 왕은 오늘날 중앙 정부처럼 모든 지역을 직접 지배하지 못했습니다. 제국 곳곳에는 강력한 제후들이 자신의 영지와 군사력을 가지고 있었습니다.", false, null);
            }
        }

        function renderStage2() {
            document.getElementById('content-area').innerHTML = `
                <div class="space-y-5">
                    <div class="text-indigo-400 text-base">[ 🕹️ 2단계 ― 주교는 누구의 사람인가? ]</div>
                    
                    <div class="bg-slate-900 p-5 panel-box text-slate-200 text-sm md:text-base leading-relaxed break-keep border-l-4 border-l-indigo-500">
                        <span class="text-yellow-400 font-bold block mb-2">📜 상황</span>
                        “대주교와 주교는 단순한 종교 지도자만이 아니다.<br>
                        넓은 토지와 재산을 가지고 있으며 정치적으로도 큰 영향력을 가진다.<br>
                        왕권을 안정시키려면 내가 믿을 수 있는 성직자가 필요하다.<br>
                        그런데 교황 그레고리우스 7세는 세속 군주가 고위 성직자의 임명과 서임에 개입하는 것을 문제 삼기 시작했다.”
                    </div>

                    <div class="bg-slate-950 p-4 border-2 border-slate-700 panel-box text-xs md:text-sm space-y-2">
                        <div class="text-yellow-400 font-bold">⚔️ 개념 정리: 성직자 서임권을 둘러싼 갈등</div>
                        <div class="flex justify-around items-center text-center pt-2">
                            <div class="text-yellow-300">👑 왕<br><span class="text-slate-300 text-xs">“주교는 정치적으로도 중요하다!”</span></div>
                            <div class="text-red-400 font-bold text-lg">VS</div>
                            <div class="text-blue-300">✝️ 교황<br><span class="text-slate-300 text-xs">“성직자는 세속 군주의 지배에서 벗어나야 한다!”</span></div>
                        </div>
                    </div>

                    <div class="space-y-4 pt-2">
                        <button onclick="chooseStage2('A')" class="pixel-btn bg-slate-900 hover:bg-slate-800 w-full p-4 text-left text-sm md:text-base text-yellow-300">
                            [선택 A] “왕에게도 성직자 임명에 개입할 권한이 있다!”<br>
                            <span class="text-xs text-slate-400 mt-2 block">👑 왕권 +10 / ✝️ 교황 관계 -40</span>
                        </button>
                        <button onclick="chooseStage2('B')" class="pixel-btn bg-slate-900 hover:bg-slate-800 w-full p-4 text-left text-sm md:text-base text-blue-300">
                            [선택 B] “교황의 요구를 받아들이고 성직자 임명에서 물러난다.”<br>
                            <span class="text-xs text-slate-400 mt-2 block">👑 왕권 -10 / ✝️ 교황 관계 +10</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function chooseStage2(type) {
            saveState();
            if (type === 'A') {
                kingPower = Math.min(100, kingPower + 10);
                popeRelation = Math.max(0, popeRelation - 40);
                showModal("⚔️ 선택의 결과", "주교는 종교 지도자인 동시에 넓은 토지와 정치적 영향력을 가진 중요한 세력이었습니다. 왕에게 성직자 임명 문제는 단순한 종교 문제가 아니라 왕권과도 관련된 문제였습니다. 하지만 교황과의 갈등은 크게 심화됩니다.", true, () => {
                    currentStage++;
                    renderStage();
                });
            } else {
                kingPower = Math.max(0, kingPower - 10);
                popeRelation = Math.min(100, popeRelation + 10);
                showModal("⚖️ 선택의 결과", "교황과의 충돌은 줄일 수 있습니다. 그러나 왕이 성직자들에게 행사하던 정치적 영향력도 줄어들게 됩니다.", true, () => {
                    currentStage++;
                    renderStage();
                });
            }
        }

        function renderStage3() {
            document.getElementById('content-area').innerHTML = `
                <div class="space-y-5">
                    <div class="text-red-400 text-base animate-pulse">[ 🕹️ 3단계 ― 🚨 파문! 왕위가 흔들린다 ]</div>
                    
                    <div class="bg-red-950/60 border-2 border-red-700 p-5 panel-box text-slate-200 text-sm md:text-base leading-relaxed space-y-3 border-l-4 border-l-red-500 break-keep">
                        <span class="text-yellow-400 font-bold block">📜 상황</span>
                        <p class="text-red-300 text-base md:text-lg">“결국 1076년, 교황 그레고리우스 7세가 나를 파문했다!”</p>
                        <div class="bg-red-900/50 p-3 border border-red-800 rounded-sm">
                            <span class="text-yellow-400 font-bold">⚠️ 파문 발생!</span><br>
                            <span class="text-slate-200 text-xs md:text-sm">파문: 교회 공동체에서 배제하는 교회의 처벌</span>
                        </div>
                    </div>
                    
                    <div class="bg-slate-900 p-4 panel-box text-sm space-y-3">
                        <p class="text-yellow-300 text-base">질문: “그런데 왕이 파문당한 것이 왜 정치적으로도 위험했을까?”</p>
                        <button onclick="showHint()" class="pixel-btn bg-indigo-700 hover:bg-indigo-600 px-5 py-2 text-xs md:text-sm text-white">💡 힌트 보기 ("요람에서 무덤까지")</button>
                        
                        <div id="hint-box" class="hidden text-xs md:text-sm text-slate-300 bg-slate-950 p-4 border-2 border-slate-700 space-y-2">
                            <p class="text-indigo-300 font-bold">💡 힌트 ― “요람에서 무덤까지”</p>
                            <p class="flex items-center space-x-1 flex-wrap text-xs md:text-sm">
                                <span>👶 세례</span> <span>➔</span> <span>⛪ 미사와 신앙생활</span> <span>➔</span> <span>💍 혼인</span> <span>➔</span> <span>🙏 고해와 종교생활</span> <span>➔</span> <span>⚰️ 장례와 매장</span>
                            </p>
                            <p class="text-yellow-200 pt-2 border-t border-slate-800 leading-relaxed">“중세 서유럽에서 교회는 사람의 출생부터 죽음까지 삶의 중요한 순간에 깊이 관여하였다.”</p>
                        </div>
                    </div>

                    <!-- 백성들의 반응 -->
                    <div class="space-y-2">
                        <p class="text-yellow-400 text-sm font-bold">👥 백성들의 반응</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs text-slate-300">
                            <div class="bg-slate-950 p-3 border border-slate-700 panel-box">
                                <span class="text-yellow-300 font-bold">👨‍🌾 농민</span><br>
                                “왕이 교회에서 파문당했다고?”
                            </div>

        function addHashtag(tag) {
            const input = document.getElementById('insta-caption-input');
            if (input) {
                if (!input.value.includes(tag)) {
                    input.value = (input.value.trim() + ' ' + tag).trim();
                    updateInstaCard();
                }
            }
        }

        function updateInstaCard() {
            const captionInput = document.getElementById('insta-caption-input');
            const previewCaption = document.getElementById('preview-caption');

            if (previewCaption && captionInput) {
                previewCaption.innerText = captionInput.value.trim() !== '' ? captionInput.value.trim() : '하인리히 4세의 심정을 적어보세요...';
            }
        }

        function downloadInstaCard() {
            const card = document.getElementById('insta-card');
            if (!card) return;

            showModal("⏳ 이미지 생성 중", "인스타그램 카드 이미지를 생성하고 있습니다...", false, null);

            html2canvas(card, {
                scale: 2,
                useCORS: true,
                backgroundColor: "#000000"
            }).then(canvas => {
                closeModal();
                const link = document.createElement('a');
                link.download = `하인리히4세_인스타그램.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                setTimeout(() => {
                    showModal("📸 저장 완료!", "인스타그램 카드가 <strong>.png 이미지 파일</strong>로 다운로드되었습니다!<br><br>아래 <strong>[🔗 게시판에 이미지 제출하기]</strong> 버튼을 눌러 저장된 이미지를 업로드해 주세요.", true, null);
                }, 300);
            }).catch(err => {
                closeModal();
                showModal("❌ 오류 발생", "이미지 저장 중 오류가 발생했습니다. 화면을 직접 캡처하여 게시판에 제출해 주세요.", false, null);
            });
        }

        // 초기 화면 렌더링
        renderStage();
